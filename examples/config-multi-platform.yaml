# Illustrative GitShift configuration. Prefer `gitshift add` and `gitshift update`
# over hand-editing. Use absolute key paths for your own operating system.

config_version: "1.1.0"

accounts:
  personal-github:
    alias: personal-github
    name: Alex Example
    email: alex@example.com
    ssh_key_path: /home/alex/.ssh/id_ed25519_github_personal
    platform: github
    username: alex
    domain: github.com
    description: Personal GitHub account
    is_default: true
    status: active

  work-gitlab:
    alias: work-gitlab
    name: Alex Example
    email: alex@company.example
    ssh_key_path: /home/alex/.ssh/id_ed25519_gitlab_work
    platform: gitlab
    username: alex-work
    domain: gitlab.company.example
    api_endpoint: https://gitlab.company.example/api/v4
    description: Company GitLab account
    is_default: false
    status: active

current_account: personal-github

auto_switch:
  # Applied by the zsh hook when no rule below matches. Omit to keep the
  # current identity outside rule directories.
  default_account: personal-github
  rules:
    - path: /home/alex/dev/personal
      account: personal-github
      created_at: 2026-10-16T12:00:00Z
    - path: /home/alex/dev/work
      account: work-gitlab
      created_at: 2026-10-16T12:00:00Z
