name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release tag (for example v1.5.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.x'
  BINARY_NAME: gitshift

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # The write token is used only for the tag push and GoReleaser below,
          # never stored in .git/config while tests run third-party code.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run releases from the main branch, not $GITHUB_REF"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be an exact stable semantic version such as v1.5.0"
            exit 1
          fi

          git fetch --force --tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::The dispatched commit is no longer the current origin/main HEAD. Rerun the workflow."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

          RELEASE_PROBE="$RUNNER_TEMP/release-probe.json"
          if ! RELEASE_STATUS="$(curl --silent --show-error \
            --output "$RELEASE_PROBE" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"; then
            echo "::error::Unable to confirm that release $VERSION does not exist"
            exit 1
          fi

          case "$RELEASE_STATUS" in
            404)
              ;;
            200)
              echo "::error::Release $VERSION already exists"
              exit 1
              ;;
            *)
              echo "::error::GitHub API returned HTTP $RELEASE_STATUS while checking release $VERSION"
              cat "$RELEASE_PROBE"
              exit 1
              ;;
          esac

          LATEST_TAG="$(git tag --list \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | grep -vxF "$VERSION" \
            | sort -V \
            | tail -n 1 || true)"

          if [[ -n "$LATEST_TAG" ]]; then
            if [[ "$(printf '%s\n%s\n' "$LATEST_TAG" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
              echo "::error::Version $VERSION must be greater than the latest stable tag $LATEST_TAG"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
              echo "::error::Latest stable tag $LATEST_TAG is not an ancestor of main"
              exit 1
            fi
            if [[ "$(git rev-list --count "$LATEST_TAG..HEAD")" -eq 0 ]]; then
              echo "::error::There are no commits to release after $LATEST_TAG"
              exit 1
            fi
          fi

          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error::Repository secret HOMEBREW_TAP_TOKEN is not set; GoReleaser cannot update techishthoughts-org/homebrew-tap"
            exit 1
          fi

          echo "Validated $VERSION from $GITHUB_SHA (previous: ${LATEST_TAG:-none})"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # The release must have a dated "## [X.Y.Z] - YYYY-MM-DD" section.
          awk -v want="${VERSION#v}" '
            /^(## \[|\[[^]]+\]: )/ { if (found) exit; found = index($0, "## [" want "] - ") == 1; next }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION#v}] - YYYY-MM-DD' section"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check generated command reference is current
        run: |
          go run ./tools/gendocs
          git diff --exit-code -- docs/reference/commands

      - name: Verify release build without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=publish
        env:
          HOMEBREW_TAP_TOKEN: unused-for-snapshot

      - name: Create annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::error::origin/main advanced after verification. No tag was created; rerun the workflow."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" "$GITHUB_SHA" -m "GitShift $VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$VERSION"

      - name: Publish release and Homebrew cask
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/verify"
          mkdir -p "$verify_dir"
          gh release download "$VERSION" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum --check checksums.txt)

          number="${VERSION#v}"
          EXPECTED="$(for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
              echo "gitshift_${number}_${target}.tar.gz"
            done
            echo "gitshift_${number}_windows_amd64.zip"
            echo "gitshift_${number}_windows_arm64.zip"
            echo checksums.txt)"
          ACTUAL="$(gh release view "$VERSION" --json assets --jq '.assets[].name' | sort)"
          if [[ "$ACTUAL" != "$(sort <<< "$EXPECTED")" ]]; then
            echo "::error::Published asset set does not match the release contract"
            diff <(sort <<< "$EXPECTED") <(printf '%s\n' "$ACTUAL") || true
            exit 1
          fi

          tar -xzf "$verify_dir/gitshift_${number}_linux_amd64.tar.gz" -C "$verify_dir" gitshift
          if [[ "$("$verify_dir/gitshift" --version | head -n 1)" != "gitshift $VERSION" ]]; then
            echo "::error::Linux binary does not report gitshift $VERSION"
            exit 1
          fi

          cask="$(gh api "repos/techishthoughts-org/homebrew-tap/contents/Casks/gitshift.rb" --jq .content | base64 -d)"
          if ! grep -q "version \"${number}\"" <<< "$cask"; then
            echo "::error::Homebrew cask was not updated to ${number}"
            exit 1
          fi

      - name: Release summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Released $VERSION"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Assets: six platform archives plus \`checksums.txt\`"
            echo "- Homebrew: \`brew install --cask techishthoughts-org/tap/gitshift\`"
            echo "- URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
