name: Documentation

on:
  push:
    branches: [main]
    paths: ['**.md', .github/workflows/docs.yml]
  pull_request:
    paths: ['**.md', .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline: only links between files in this repository are checked, so
      # the result does not depend on external sites or unpublished releases.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments README.md CONTRIBUTING.md CHANGELOG.md 'docs/**/*.md'
          fail: true
