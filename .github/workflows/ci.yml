name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.26.0'

jobs:
  verify:
    name: Test, Vet, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: |
          go mod download
          go test -v -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...
