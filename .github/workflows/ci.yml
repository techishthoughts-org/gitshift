name: CI

on:
  push:
    branches: [main, develop]
  # Every pull request, including ones stacked on another feature branch.
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.x'

jobs:
  verify:
    name: Test, Vet, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: |
          go mod download
          go test -v -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Check generated command reference is current
        run: |
          go run ./tools/gendocs
          if ! git diff --exit-code -- docs/reference/commands || [ -n "$(git status --porcelain -- docs/reference/commands)" ]; then
            echo "::error::docs/reference/commands is stale. Run 'make docs' and commit the result."
            exit 1
          fi

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: check
